name: Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["NetStrazh/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["NetStrazh/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Опубликовать APK в Releases"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NetStrazh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: NetStrazh

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "NetStrazh-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: NetStrazh-1.0.${{ github.run_number }}
          path: NetStrazh/NetStrazh-*.apk

      - name: Publish to Releases
        if: >-
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
          (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сетевой страж 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: NetStrazh/NetStrazh-*.apk
          body: |
            Сборка ${{ github.run_number }} из `${{ github.ref_name }}` (${{ github.sha }}).
            Скачайте файл `.apk` на телефон и установите его (разрешите установку из этого источника).
