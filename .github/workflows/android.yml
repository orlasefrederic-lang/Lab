name: Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["NetStrazh/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["NetStrazh/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Опубликовать APK в Releases"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NetStrazh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "NetStrazh-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: NetStrazh-1.0.${{ github.run_number }}
          path: NetStrazh/NetStrazh-*.apk

      - name: Publish to Releases
        if: >-
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
          (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сетевой страж 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: NetStrazh/NetStrazh-*.apk
          body: |
            Сборка ${{ github.run_number }} из `${{ github.ref_name }}` (${{ github.sha }}).
            Скачайте файл `.apk` на телефон и установите его (разрешите установку из этого источника).

  e2e:
    # End-to-end tests on a real Android emulator: VPN, DNS, HTTPS, UDP, blocking, proxy chaining, screens.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: NetStrazh
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34, 35]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Run tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: NetStrazh
          script: ./gradlew --no-daemon connectedDebugAndroidTest; s=$?; adb logcat -d > logcat-api${{ matrix.api }}.txt; exit $s

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-api${{ matrix.api }}
          path: |
            NetStrazh/app/build/reports/androidTests/
            NetStrazh/app/build/outputs/androidTest-results/
            NetStrazh/logcat-api*.txt
