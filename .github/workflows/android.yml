name: Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["NetStrazh/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["NetStrazh/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Опубликовать APK в Releases"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    outputs:
      apk: ${{ steps.name.outputs.apk }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NetStrazh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: NetStrazh/app/build/reports/lint-results-debug.*

      - name: Build APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        id: name
        # The version the app shows (VERSION, e.g. 2.0) and the build number (versionCode - 100).
        run: |
          apk="NetStrazh-$(tr -d '[:space:]' < VERSION)-build${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "$apk.apk"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.apk }}
          path: NetStrazh/NetStrazh-*.apk

  e2e:
    # End-to-end tests on a real Android emulator: VPN, DNS, HTTPS, UDP, blocking, proxy chaining, screens.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: NetStrazh
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34, 35]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Free disk space
        # Runners of private repositories have less disk: the API 34 emulator stopped at "Not enough
        # space to create userdata partition". Toolchains this job never uses make room.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Run tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: NetStrazh
          script: ./gradlew --no-daemon connectedDebugAndroidTest; s=$?; adb logcat -d > logcat-api${{ matrix.api }}.txt; exit $s

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-api${{ matrix.api }}
          path: |
            NetStrazh/app/build/reports/androidTests/
            NetStrazh/app/build/outputs/androidTest-results/
            NetStrazh/logcat-api*.txt

  release:
    # Publishes only an APK that also passed the emulator tests.
    needs: [build, e2e]
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.apk }}

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ needs.build.outputs.apk }}
          target_commitish: ${{ github.sha }}
          files: NetStrazh-*.apk
          body: |
            Сборка ${{ github.run_number }} из `${{ github.ref_name }}` (${{ github.sha }}).
            Скачайте файл `.apk` на телефон и установите его (разрешите установку из этого источника).
